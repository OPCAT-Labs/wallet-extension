name: Claude PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    # Branches of this repository only. pull_request_target runs with the organisation's token and
    # is not covered by the approval gate that fork PRs get on pull_request, and this repository is
    # public, so a fork PR must not be able to start this workflow.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: OPCAT-Labs/common-tools/.github/workflows/claude-pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
